name: qa-crawler

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      target_url:
        description: URL of the application to crawl (optional)
        required: false

permissions:
  contents: read

# Two vitest workers per runner (4 vCPU): the timed unit test and the recorder's typing tests are
# timing-sensitive on a loaded runner. The integration shards keep the parallelism.
env:
  QA_TEST_WORKERS: 2

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  # Integration tests (real browser, local fixture apps) split into shards that run in parallel:
  # each shard installs Chromium and runs a sixth of the files (vitest distributes them by name).
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Integration tests (shard ${{ matrix.shard }}/6)
        run: npx vitest run --project integration --shard=${{ matrix.shard }}/6

  # The installable packages: build, `npm pack` of @qa-crawler/core and @qa-crawler/cli, content
  # check of the tarballs, then installation of the tarballs into the consumer fixtures
  # (Angular, React, generic, OpenAPI) and `npx qa-crawler init | replay | analyze | test-api`.
  packaging:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the packages
        run: npm run build
      - name: Check the tarball contents
        run: npm run pack:check
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Install from the tarballs and run the CLI in the fixtures
        run: npm run test:packaging
      - name: Pack the tarballs
        run: mkdir -p dist-packages && npm pack --workspace packages/core --workspace packages/cli --pack-destination ./dist-packages
      - name: Upload the tarballs
        uses: actions/upload-artifact@v4
        with:
          name: qa-crawler-packages
          path: dist-packages/
          if-no-files-found: ignore
          retention-days: 14

  # Windows: the same build, tarball check and consumer installation as `packaging`, run from
  # PowerShell (what `npx qa-crawler` meets on a developer's machine). Git Bash and WSL run the
  # same Node and npm binaries as PowerShell and Linux respectively, so these two jobs cover them.
  packaging-windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build the packages
        run: npm run build
      - name: Check the tarball contents
        run: npm run pack:check
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Install from the tarballs and run the CLI in the fixtures
        run: npm run test:packaging
      - name: Unit tests
        run: npm test

  # Persistence against real databases: the same contract tests and an end-to-end
  # crawl for PostgreSQL and SQL Server (throwaway service containers, CI-only passwords),
  # plus the hybrid storage on real object stores: an S3 server that checks Signature V4
  # (moto, throwaway key) and the Azure Blob emulator (Azurite, its public development key).
  persistence:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: qa
          POSTGRES_PASSWORD: qa-ci-only
          POSTGRES_DB: qa_crawler
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U qa" --health-interval 5s --health-timeout 5s --health-retries 20
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: Qa-ci-only-1
          MSSQL_PID: Developer
        ports: ['1433:1433']
    env:
      QA_TEST_PG_HOST: 127.0.0.1
      QA_TEST_PG_PORT: '5432'
      QA_TEST_PG_DATABASE: qa_crawler
      QA_TEST_PG_USERNAME: qa
      QA_TEST_PG_PASSWORD: qa-ci-only
      QA_TEST_MSSQL_HOST: 127.0.0.1
      QA_TEST_MSSQL_PORT: '1433'
      QA_TEST_MSSQL_DATABASE: qa_crawler
      QA_TEST_MSSQL_USERNAME: sa
      QA_TEST_MSSQL_PASSWORD: Qa-ci-only-1
      # Conteneur local au certificat auto-signé : accepté pour ce test seulement.
      QA_TEST_MSSQL_TRUST_CERT: 'true'
      # Azurite : le compte et la clé de développement publiés par Microsoft (aucun secret).
      QA_TEST_AZURE_URL: http://127.0.0.1:10000/devstoreaccount1
      QA_TEST_AZURE_ACCOUNT: devstoreaccount1
      QA_TEST_AZURE_KEY: Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Wait for SQL Server
        run: |
          for attempt in $(seq 1 60); do
            docker exec ${{ job.services.sqlserver.id }} /opt/mssql-tools18/bin/sqlcmd \
              -S localhost -U sa -P "$QA_TEST_MSSQL_PASSWORD" -C -Q "SELECT 1" > /dev/null && exit 0
            sleep 2
          done
          exit 1
      - name: Object stores (S3 with signature checks, Azure Blob emulator)
        run: |
          python3 -m venv "$RUNNER_TEMP/moto"
          "$RUNNER_TEMP/moto/bin/pip" install --quiet "moto[server]==5.0.28"
          # Three unauthenticated IAM calls create the key; every later request must be signed.
          INITIAL_NO_AUTH_ACTION_COUNT=3 nohup "$RUNNER_TEMP/moto/bin/moto_server" -H 127.0.0.1 -p 4570 \
            > "$RUNNER_TEMP/moto.log" 2>&1 &
          nohup npx --yes --package=azurite@3.37.0 azurite-blob --blobHost 127.0.0.1 --blobPort 10000 \
            --location "$RUNNER_TEMP/azurite" --skipApiVersionCheck > "$RUNNER_TEMP/azurite.log" 2>&1 &
          # TCP only: an HTTP probe would use one of moto's unauthenticated calls.
          for port in 4570 10000; do
            for attempt in $(seq 1 60); do
              (exec 3<>/dev/tcp/127.0.0.1/$port) 2>/dev/null && break
              sleep 2
            done
          done
          "$RUNNER_TEMP/moto/bin/python" -I scripts/ci-moto-s3.py http://127.0.0.1:4570 >> "$GITHUB_ENV"
      - name: Persistence tests (PostgreSQL, SQL Server, object stores)
        run: >-
          npx vitest run tests/integration/persistence-postgres.test.ts tests/integration/persistence-sqlserver.test.ts
          tests/integration/storage-object-stores.test.ts

  # Real smoke test, only when a target is available (repository variable
  # TARGET_URL or a manual run with target_url). Never runs against nothing.
  smoke:
    needs: build
    if: ${{ vars.TARGET_URL != '' || github.event.inputs.target_url != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Crawl
        env:
          QA_BASE_URL: ${{ github.event.inputs.target_url || vars.TARGET_URL }}
          QA_USERNAME: ${{ secrets.QA_USERNAME }}
          QA_PASSWORD: ${{ secrets.QA_PASSWORD }}
        run: npm run qa -- scenarios/smoke.yaml
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-report
          path: |
            reports/
            screenshots/
          retention-days: 14
