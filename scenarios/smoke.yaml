# Smoke mission: explore the application from its home page and report
# broken pages, HTTP/API errors and JavaScript errors. No steps are listed:
# the explorer discovers screens and flows by itself.
#   npm run qa -- scenarios/smoke.yaml --base-url https://my-pr-env.example.com
mission:
  name: smoke-test

target:
  baseUrl: http://localhost:4200
  startAt: /

exploration:
  maxStates: 50
  maxActions: 200
  maxDepth: 6
  maxDurationMinutes: 10

goals:
  discoverNavigation: true
  discoverForms: false
  discoverFlows: true
  detectErrors: true

http:
  failOnStatus: 400

safety:
  allowedHosts:
    - localhost
  ignoredPaths:
    - /logout
    - /payment
    - /delete
  allow: [navigation, tabs, menus, details, pagination, search, filter, other]
  block:
    [delete, payment, send, logout, irreversible, sensitive-data, external-navigation, form-submit, download]
