# Fully documented mission. Every key is optional except target.baseUrl;
# the values below are the defaults unless stated otherwise.
# The YAML never lists buttons to click: it gives a goal and limits.
mission:
  name: explore-application
  description: Every available option, with its default value
  mode: explore # explore | learn | verify (the CLI command wins)

target:
  baseUrl: http://localhost:4200 # required — overridable with --base-url or QA_BASE_URL
  startAt: / # first screen, relative to baseUrl

exploration:
  maxStates: 100 # distinct functional states (screens, steps, tabs)
  maxActions: 500 # actions executed (clicks, navigations, fills)
  maxDepth: 10 # transitions away from the start state
  maxDurationMinutes: 15
  actionTimeoutMs: 10000 # locate + execute one action
  navigationTimeoutMs: 15000
  waitUntil: load # load | domcontentloaded | networkidle | commit
  settleTimeMs: 400 # extra wait after each action (SPA rendering, API calls)
  maxStatesPerRoute: 3 # /users/1, /users/2 … share the route /users/:id: 3 samples are enough
  maxSimilarActions: 2 # days of a date picker, page numbers, "View" on each row: 2 samples per screen
  queryParams:
    mode: pattern # pattern: ?page=1..N share one route | ignore | keep
    ignored: ['utm_*', 'fbclid', 'gclid', '_', 'ts', 'timestamp', 'cachebuster']
  maxRecordedActions: 200 # actions recorded per state

goals:
  discoverNavigation: true # follow links and routerLinks
  discoverForms: true # fill forms with fake test data before clicking their step buttons
  discoverFlows: true # click tabs, menus, details, toggles, wizard steps
  detectErrors: true # network, console and JavaScript observers
  keywords: [] # goal keywords, e.g. [users, utilisateurs, permissions]: matching actions are explored first
  # discover: { navigation: true, forms: true, dialogs: true } # short form of discover*

scoring:
  weights: {} # overrides of DEFAULT_SCORING_WEIGHTS, e.g. { newState: 150, export: 0 }

network:
  trace: true # attach to each transition the HTTP exchanges of its action (no header, no body)
  resourceTypes: [document, xhr, fetch]
  maxRequestsPerAction: 50

baseline:
  dir: baseline # learn writes it (with history under runs/), verify and explore read it
  # application: my-app      # default: mission.name
  # environment: qa          # default: QA_ENVIRONMENT
  # branch / commit          # default: QA_BRANCH / QA_COMMIT, then CI variables
  # gitDir: ../my-app        # read branch/commit with git
  keepRuns: 20

verify:
  failOnRegression: true # exit code 1 when a known transition changed, fails or is unreachable

browser:
  headless: true
  viewport: { width: 1366, height: 768 }
  # locale: fr-FR
  ignoreHttpsErrors: false
  args: ['--disable-dev-shm-usage']
  slowMoMs: 0

checks:
  consoleErrors: true
  consoleWarnings: false
  pageErrors: true
  httpErrors: true # API/resource responses >= http.failOnStatus
  requestFailures: true
  brokenLinks: true # screens whose document answers >= http.failOnStatus
  screenshots: true # one per discovered state
  screenshotOnError: true # when an ERROR/CRITICAL anomaly happens
  fullPageScreenshots: false

http:
  failOnStatus: 400
  ignoreStatus: []
  ignoreUrlPatterns: [] # substrings, e.g. ['/analytics']

safety:
  allowedHosts: [] # default: host of target.baseUrl ('*.example.com' allowed)
  ignoredPaths: [/logout, /signout, /sign-out, /deconnexion]
  allowedActionClasses: [SAFE] # SAFE | MUTATION | DANGEROUS | UNKNOWN (DANGEROUS: disposable environments only; risks in `block` still apply)
  allow: # kinds of SAFE actions the mission may execute
    [navigation, tabs, menus, details, pagination, search, filter, forms, other]
  block: # risks always blocked (sensitive-data is blocked even if omitted)
    [delete, payment, send, logout, irreversible, sensitive-data, external-navigation, form-submit, download]
  keywords: # extra vocabulary for the classification
    safe: []
    mutation: []
    dangerous: []
  mutations: # actions changing data (create, save, send a form); DANGEROUS ones are never executed
    enabled: false # true: MUTATION and form submission allowed, within the budget
    maxPerRun: 10

# auth:
#   type: form
#   loginUrl: /login
#   usernameSelector: 'input[name="username"]'
#   passwordSelector: 'input[type="password"]'
#   submitSelector: 'button[type="submit"]'
#   usernameEnv: QA_USERNAME
#   passwordEnv: QA_PASSWORD
#   successSelector: 'nav .user-menu'
#
# Browser sign-in dialog (HTTP Basic / NTLM, e.g. SiteMinder Basic scheme):
# auth:
#   type: http
#   origin: https://sso.example.com   # only send the credentials there (recommended)
#   usernameEnv: QA_USERNAME
#   passwordEnv: QA_PASSWORD
#   checkUrl: /                       # page loaded to check the login (default: target.startAt)
auth:
  type: none

# Credential profiles: NAMES of environment variables only, never secrets.
credentials: {}
#  qa-default: { usernameEnv: QA_USERNAME, passwordEnv: QA_PASSWORD }

# Interactions raised by the browser outside the DOM (native sign-in dialog,
# alert/confirm/prompt, popups, downloads, file chooser, permissions, external navigation).
forms:
  autoFill: true # fill the forms of each screen (even without <form>), then report validation messages (alias: exercise)
  # submit: false # buttons that send a form: false never, true like any MUTATION; unset: safety.block decides
  validationTesting: false # true: also type invalid values (empty, bad email, out of bounds…) and check they are refused
  maxValidationCasesPerField: 3
  maxValidationCasesPerForm: 10

testData:
  # runId: abc123 # tag of the created data (QA-CRAWLER-<runId>); default: generated for each run
  defaults: {} # values per meaning, e.g. { firstName: QA, lastName: Crawler, country: Canada }
  fields: {} # value per field label/name/placeholder, e.g. { "Code agence": "12345", email: { value: qa@example.test } }
  # priority: fields > defaults / field rule > field type > safe fallback; sensitive fields are never filled
  # fields expecting digits (inputmode numeric, digits pattern, hint "99999") get digits, never "QA Test"

# Test oracles: every executed action gets PASS / FAIL / WARNING / UNKNOWN.
# UNKNOWN is never turned into PASS; the business result stays unknown.
oracles:
  enabled: true
  technical: { api404: warning } # warning | fail
  ui: { enabled: true, errorTexts: [] } # extra words making a visible alert an error message
  baseline: { enabled: true } # compare with the transition learned in the baseline

openapi:
  enabled: false
  # source: openapi.yaml # file, or a URL on an allowed host: statuses checked, form fields completed

# Static analysis: the application's code (Angular / TypeScript / JavaScript) as extra evidence,
# never a runtime truth. Read, never executed. Off by default: nothing changes when off.
staticAnalysis:
  enabled: false
  mode: auto # auto: source if source.root is given, else the scripts the browser loaded (bundle)
  strategy: on-demand # on-demand: only when a field cannot be resolved without it; eager: at start
  source: { enabled: true } # root: ../my-app  (relative to this file)
  bundle: { enabled: true, sourceMaps: true }
  cache: { enabled: true } # directory: default knowledge/static next to the reports folder
  budgets: { maxFiles: 500, maxDurationMs: 30000, maxFileSizeBytes: 2000000, maxAstNodes: 5000000 }
  analyzers: { angular: true, genericJs: true }
  features: { routes: true, forms: true, validators: true, dtoMapping: true, httpCalls: true, dataFlow: true }
  semanticResolution: { enabled: true }
  dryRun: { useStaticKnowledge: true }
  # version: 1.4.0   # of the analysed application (else QA_VERSION)
  # commit: 1a2b3c4  # (else QA_COMMIT) — part of the cache identity

# After a failure: strategies tried in this order (one left out is never used).
recovery:
  enabled: true
  strategies: [retry, dismiss-dialog, escape, back, known-url, replay-path, reauthenticate, abandon-branch]
  maxRetries: 1 # transient errors only, never an action sending data
  maxReauthentications: 2 # after a session expiry
  circuitBreaker: { threshold: 2, maxFailuresPerState: 5 }
  stuck: { oscillationCycles: 3, maxNoOpActions: 15, maxBusyObservations: 3 }

accessibility:
  enabled: true # missing names, image links without text, duplicate ids, clickable elements the keyboard cannot reach
  keyboardNavigation: false # true: also walk each new screen with Tab (keyboard trap, no focus)
  maxTabs: 30

# After each run: the paths found, written as imposed flows (reports/generated-flows.yaml).
flowGeneration:
  enabled: true
  maxFlows: 30

logging:
  level: INFO # ERROR | WARN | INFO | DEBUG | TRACE → reports/engine-log.jsonl
  file: true

# Other users: after the exploration, each one opens the screens found (page loads only).
actors: []
#  - name: reader
#    auth: { type: form, loginUrl: /login, usernameSelector: '#user', passwordSelector: '#pass',
#            submitSelector: 'button[type=submit]', usernameEnv: QA_READER_USER, passwordEnv: QA_READER_PASSWORD }
authorization:
  enabled: true
  primaryActor: primary # name of the mission's own user (auth) in the reports
  rules: [] # e.g. [{ actor: reader, path: /admin/*, expect: denied }]
  maxTargets: 50
  deniedTexts: [] # extra words showing a refusal on a page answered 200

browserInteractions:
  enabled: true
  timeoutMs: 15000
  retry:
    maxAttempts: 2 # the browser asking again (rejected credentials): tries before AUTH_FAILED
  loopThreshold: 5 # same interaction, origin and action more often: INTERACTION_LOOP_DETECTED
  blockedOrigins: []
  httpAuth:
    # credentialProfile: qa-default   # none: AUTH_REQUIRED (nothing is invented)
    origins: [] # who may receive the credentials (default: target and allowed hosts)
  dialogs:
    alert: accept # accept | dismiss
    confirm: dismiss # dismiss | accept-safe (never accepts a destructive or mutating message)
    promptValues: [] # [{ match: "Nom du dossier", value: "Dossier QA" }] or value: { env: NAME }
  popups:
    observe: true # new page on an allowed origin: recorded as a state, then closed
    closeAfterMs: 0 # leave it open up to this long so it can finish on its own (SSO popup: 10000)
  permissions:
    grant: [] # geolocation, notifications, camera, microphone, clipboard-read, clipboard-write

memory:
  # file: reports/flow-graph.json    # default: <reportsDir>/flow-graph.json
  resume: false # true: continue from the previous graph, skip actions already tried

output:
  reportsDir: reports
  screenshotsDir: screenshots
  json: true
  html: true
  flowGraphHtml: true

report:
  failOnSeverity: ERROR # INFO | WARNING | ERROR | CRITICAL | NONE — sets the CLI exit code
  language: en # en | fr — language of index.html and flow-graph.html (result.json stays in English)
